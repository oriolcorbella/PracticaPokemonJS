<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokememory</title>
</head>
<body>
    <header class="app-header">
        <h1>Pokememory</h1>
    </header>

    <main class="app-main">
        <form id="user-form" class="user-form">
            <h2>Registro</h2>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <button type="submit" class="btn">Entrar</button>
        </form>

        <div id="game" class="game" hidden>
            <section class="game-controls">
                <form id="game-form" class="game-form">
                    <label for="cards-number">Número de cartas</label>
                    <input type="number" id="cards-number" name="cards-number" placeholder="Ej: 12">
                    <button type="submit" id="play-btn" class="btn">Jugar</button>
                </form>
                <p class="timer-box">Tiempo: <span id="timer">0m 0s</span></p>
                <p id="game-message" class="game-message"></p>
            </section>

            <section class="board-zone">
                <div id="game-board" class="game-board"></div>
            </section>
        </div>
    </main>

    <dialog id="modal" class="modal">
        <p id="modal-message"></p>
        <form method="dialog">
            <button type="submit" class="btn">Cerrar</button>
        </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
